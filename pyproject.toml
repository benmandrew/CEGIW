[tool.black]
line-length = 80

[tool.ruff]
lint.select = [
    # "E",   # pycodestyle (errors)s
    # "F",   # pyflakes
    # "W",   # pycodestyle (warnings)
    # "I",   # isort (import sorting)
    # "N",   # pep8-naming
    # "UP",  # pyupgrade (modern syntax)
    # "RET", # flake8-return (return statement style)
    # "RUF", # Ruff-specific rules
    # "B",   # flake8-bugbear (bug-prone patterns)
    # "SIM", # flake8-simplify
    # "TID", # flake8-tidy-imports
    "ALL"
]
src = ["src", "tests"]
exclude = ["docs"]

lint.ignore = [
    "S101",  # Allow assert
    "S603",  # Allow subprocess calls
    "PT",    # Ignore all pytest rules (using unittest instead)
    "D",
    "C901",
    "PLR0911",
    "PLR0912",
    "PLR0913", # Allow too many arguments
    "ERA001",  # Allow commented-out code
    "T201",  # Allow print statements
    "E741",  # Allow short variable names
    "FBT001",
    "FBT002",
]

[tool.bandit]
skips = [
    "B101",
    "B404",
    "B603",
]

[tool.pylint.basic]
no-docstring-rgx = ".*"
disable = [
    # "missing-module-docstring",
    "too-many-return-statements",
    "too-many-branches",
    "too-few-public-methods",
    "duplicate-code",
    "too-many-arguments",
    "too-many-positional-arguments"
]

[tool.coverage.run]
source = ["src"]
parallel = true

[[tool.mypy.overrides]]
module = ["timeout_decorator.*", "sh.*"]
ignore_missing_imports = true
